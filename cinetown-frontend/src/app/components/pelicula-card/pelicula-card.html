<article class="h-full min-w-0">
  <div class="poster relative isolate flex h-full min-h-[310px] items-end overflow-hidden rounded-lg p-5 max-sm:min-h-[260px]"
       [style.background]="posterBackground"
       role="img"
       [attr.aria-label]="'Póster de ' + pelicula.titulo">
    <span class="absolute top-[18px] right-[18px] text-[10px] font-extrabold tracking-[2px] text-white/15">CINETOWN</span>
    <div class="w-full">
      <h3 class="mb-2 text-[17px] leading-tight font-bold text-texto">{{ pelicula.titulo }}</h3>
      <span class="text-[10px] tracking-wide text-white/75">ESTRENO · {{ pelicula.anio }}</span>
      <div class="mt-2.5 flex flex-wrap gap-1.5">
        @for (genero of pelicula.generos; track genero) {
          <span class="rounded-full bg-black/20 px-2 py-1 text-[10px] text-white/80">{{ genero }}</span>
        }
      </div>
    </div>
  </div>
</article>
