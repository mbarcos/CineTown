<div class="filtro-genero filtro-opciones" role="group" aria-label="Filtrar películas por género">
  @for (genero of opciones(); track genero) {
    <button
      type="button"
      class="chip-filtro vidrio-control"
      [attr.aria-pressed]="generoSeleccionado() === genero"
      (click)="generoSeleccionado.set(genero)"
    >
      {{ genero ?? 'Todas' }}
    </button>
  }
</div>

<label class="filtro-compacto filtro-genero_compacto">
  <span>Género</span>
  <select #selectorGenero class="vidrio-campo" (change)="generoSeleccionado.set(selectorGenero.value || null)">
    @for (genero of opciones(); track genero) {
      <option [value]="genero ?? ''" [selected]="generoSeleccionado() === genero">
        {{ genero ?? 'Todos los géneros' }}
      </option>
    }
  </select>
</label>
