<header class="encabezado">

  <a class="encabezado_marca" routerLink="/" aria-label="CineTown, inicio">
    CINETOWN
  </a>

  <nav class="encabezado_navegacion" aria-label="Navegación principal">

    <div class="encabezado_enlaces">

      <a class="encabezado_enlace encabezado_enlace--activo" href="#cartelera">
        Cartelera
      </a>

      @if (authService.estaAutenticado()) {
        <a class="encabezado_enlace" href="#mis-compras">
          Mis compras
        </a>
      }

    </div>

    <div class="encabezado_sesion">
      @if (!authService.estaAutenticado()) {
        <a class="encabezado_cuenta" routerLink="/login">
          Iniciar Sesión
        </a>
      } @else {
        <span class="encabezado_usuario">
          Hola, {{ authService.usuarioActual()?.nombreUsuario }}
        </span>
        <button class="encabezado_boton" (click)="authService.cerrarSesion()">
          Cerrar sesión
        </button>
      }
    </div>

  </nav>

</header>
