<header class="encabezado vidrio-panel">

  <a class="encabezado_marca" routerLink="/" aria-label="CineTown, inicio">
    CineTown
  </a>

  <nav class="encabezado_navegacion" aria-label="Navegación principal">

    <div class="encabezado_enlaces">

      <a class="encabezado_enlace" routerLink="/" fragment="cartelera" routerLinkActive="encabezado_enlace--activo" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhen="page">
        Cartelera
      </a>

      @if (authService.estaAutenticado()) {
        <a class="encabezado_enlace" routerLink="/compras" routerLinkActive="encabezado_enlace--activo">
          Mis compras
        </a>
      }

      @if (authService.esAdministrador()) {
        <a class="encabezado_enlace" routerLink="/gestion-peliculas" routerLinkActive="encabezado_enlace--activo">
          Gestión de películas
        </a>
        <a class="encabezado_enlace" routerLink="/gestion-sesiones" routerLinkActive="encabezado_enlace--activo">
          Gestión de sesiones
        </a>
        <a class="encabezado_enlace" routerLink="/recaudacion" routerLinkActive="encabezado_enlace--activo">
          Recaudación
        </a>
        <a class="encabezado_enlace" routerLink="/informes/ocupacion" routerLinkActive="encabezado_enlace--activo">
          Ocupación
        </a>
      }

    </div>

    <div class="encabezado_sesion">
      @if (!authService.estaAutenticado()) {
        <a class="encabezado_cuenta" routerLink="/login">
          Iniciar sesión
        </a>
      } @else {
        <span class="encabezado_usuario">
          Hola, {{ authService.usuarioActual()?.nombreUsuario }}
        </span>
        <button class="encabezado_cuenta" type="button" (click)="authService.cerrarSesion()">
          Cerrar sesión
        </button>
      }
    </div>

  </nav>

</header>
