<fieldset class="dias">
  <legend>Elige un día</legend>
  <div class="dias_opciones">
    @for (dia of dias(); track dia.fecha) {
      <label class="dia">
        <input
          class="sr-only"
          type="radio"
          name="dia-sesion"
          [checked]="diaSeleccionado() === dia"
          [attr.aria-label]="dia.etiqueta"
          (change)="diaSeleccionado.set(dia)"
        />
        <span class="dia_cara">
          <span class="dia_semana">{{ diaCorto(dia.fecha) }}</span>
          <time [attr.datetime]="dia.fecha">{{ fechaCorta(dia.fecha) }}</time>
        </span>
      </label>
    }
  </div>
</fieldset>

@if (diaSeleccionado(); as dia) {
  <div class="horarios">
    <h3 aria-live="polite">{{ dia.etiqueta }}</h3>
    <div class="horarios_opciones">
      @for (sesion of dia.sesiones; track sesion.id) {
        <a
          class="horario"
          [routerLink]="['/sesiones', sesion.id]"
          [attr.aria-label]="'Elegir asientos: ' + dia.etiqueta + ' a las ' + sesion.horaLegible + ', ' + sesion.precioLegible"
        >
          <time [attr.datetime]="sesion.fechaHoraInicio">{{ sesion.horaLegible }}</time>
          <span class="horario_precio">{{ sesion.precioLegible }}</span>
          <span class="horario_accion">Elegir asientos</span>
        </a>
      }
    </div>
  </div>
}
