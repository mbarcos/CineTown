spring.application.name=CineTown
spring.config.import=optional:file:./config.properties

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA}
# --- JPA / Hibernate -----------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Servidor ------------------------------------------------
server.port=8081
server.address=0.0.0.0
# --- JWT ------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# --- Confirmaciones por correo ------------------------------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.correo.remitente=${MAIL_FROM}
